<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ryoboard.</title>
<style>
  :root{
    --ink:#000000;
    --primary:#3A438C;
    --surface:#F5F5F2;
    --outline:#FFFFFF;
    --muted:#7A80B0;
    --primary-dim: #2c3369;
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;}
  body{
    background:var(--ink);
    color:var(--outline);
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif;
    min-height:100vh;
  }
  .condensed{
    font-family: "Arial Narrow", "Helvetica Neue Condensed", Impact, sans-serif;
    letter-spacing:0.01em;
  }

  /* ---- top bar ---- */
  header{
    border-bottom:1px solid var(--outline);
    padding:14px 20px;
    display:flex;
    align-items:baseline;
    gap:16px;
    background:var(--ink);
    position:sticky;
    top:0;
    z-index:10;
  }
  header .logo{
    font-family:"Arial Narrow","Helvetica Neue Condensed",Impact,sans-serif;
    font-size:26px;
    font-weight:700;
    color:var(--outline);
    text-transform:lowercase;
  }
  header .logo::after{
    content:".";
    color:var(--primary);
  }
  header .tagline{
    color:var(--muted);
    font-size:13px;
  }
  header .composer-btn{
    margin-left:auto;
    background:var(--primary);
    border:1px solid var(--outline);
    color:var(--outline);
    padding:8px 16px;
    font-size:14px;
    cursor:pointer;
    font-family:inherit;
  }
  header .composer-btn:hover{ background:var(--primary-dim); }
  header .composer-btn:focus-visible, button:focus-visible, input:focus-visible, textarea:focus-visible, select:focus-visible{
    outline:2px solid var(--outline);
    outline-offset:2px;
  }

  /* ---- layout ---- */
  .layout{
    display:flex;
    max-width:900px;
    margin:0 auto;
  }
  main{
    flex:1;
    min-width:0;
    border-left:1px solid var(--outline);
    border-right:1px solid var(--outline);
  }
  aside{
    width:190px;
    flex-shrink:0;
    padding:18px 14px;
  }
  aside h3{
    font-family:"Arial Narrow","Helvetica Neue Condensed",Impact,sans-serif;
    font-size:13px;
    color:var(--muted);
    margin:0 0 10px 0;
    font-weight:400;
  }
  .board-list{ list-style:none; padding:0; margin:0 0 24px 0; }
  .board-list li{ margin-bottom:2px; }
  .board-list button{
    background:none;
    border:none;
    color:var(--outline);
    font-family:inherit;
    font-size:14px;
    cursor:pointer;
    padding:4px 0;
    width:100%;
    text-align:left;
  }
  .board-list button.active{ color:var(--primary); text-decoration: underline; text-decoration-color:var(--primary); }
  .board-list button:hover{ color:var(--muted); }

  /* ---- sort row ---- */
  .sort-row{
    display:flex;
    gap:2px;
    border-bottom:1px solid var(--outline);
    padding:10px 16px;
  }
  .sort-row button{
    background:none;
    border:1px solid transparent;
    color:var(--muted);
    font-size:13px;
    cursor:pointer;
    padding:4px 10px;
    font-family:inherit;
  }
  .sort-row button.active{
    color:var(--outline);
    border:1px solid var(--outline);
  }

  /* ---- post row ---- */
  .post{
    display:flex;
    border-bottom:1px solid var(--outline);
    padding:14px 16px;
    gap:12px;
  }
  .vote-col{
    display:flex;
    flex-direction:column;
    align-items:center;
    width:34px;
    flex-shrink:0;
    padding-top:2px;
  }
  .vote-btn{
    background:none;
    border:none;
    color:var(--muted);
    cursor:pointer;
    font-size:16px;
    line-height:1;
    padding:3px;
  }
  .vote-btn:hover{ color:var(--outline); }
  .vote-btn.up.on{ color:var(--primary); }
  .vote-btn.down.on{ color:#B0577A; }
  .vote-count{
    font-family:"Arial Narrow","Helvetica Neue Condensed",Impact,sans-serif;
    font-size:15px;
    font-weight:700;
    margin:2px 0;
  }
  .post-body{ flex:1; min-width:0; }
  .post-meta{
    font-size:12px;
    color:var(--muted);
    margin-bottom:4px;
  }
  .post-meta .board-tag{ color:var(--primary); }
  .post-title{
    font-size:16px;
    margin:0 0 6px 0;
    line-height:1.35;
    cursor:pointer;
  }
  .post-title:hover{ color:var(--muted); }
  .post-text{
    font-size:14px;
    color:#D8D8E6;
    line-height:1.5;
    margin:0 0 8px 0;
  }
  .post-media{
    border:1px solid var(--outline);
    margin:0 0 10px 0;
    max-width:100%;
    display:block;
    background:var(--surface);
  }
  .post-media img, .post-media video{
    display:block;
    max-width:100%;
    max-height:480px;
    width:auto;
  }
  .post-actions{
    display:flex;
    gap:14px;
    font-size:12px;
    color:var(--muted);
  }
  .post-actions button{
    background:none;
    border:none;
    color:var(--muted);
    cursor:pointer;
    font-family:inherit;
    font-size:12px;
    padding:0;
  }
  .post-actions button:hover{ color:var(--outline); }

  /* ---- comments ---- */
  .comments{
    padding:10px 16px 16px 46px;
    border-bottom:1px solid var(--outline);
    display:none;
  }
  .comments.open{ display:block; }
  .comment{
    font-size:13px;
    padding:8px 0 8px 10px;
    border-left:2px solid var(--primary);
    margin-bottom:6px;
    color:#D8D8E6;
  }
  .comment .c-meta{ color:var(--muted); font-size:11px; margin-bottom:2px; }
  .comment-form{
    display:flex;
    gap:8px;
    margin-top:8px;
  }
  .comment-form input{
    flex:1;
    background:var(--ink);
    border:1px solid var(--muted);
    color:var(--outline);
    padding:7px 9px;
    font-size:13px;
    font-family:inherit;
  }
  .comment-form input::placeholder{ color:var(--muted); }
  .comment-form button{
    background:var(--primary);
    border:1px solid var(--outline);
    color:var(--outline);
    padding:0 14px;
    cursor:pointer;
    font-size:13px;
    font-family:inherit;
  }

  /* ---- composer modal ---- */
  .modal-backdrop{
    display:none;
    position:fixed; inset:0;
    background:rgba(0,0,0,0.7);
    z-index:100;
    align-items:flex-start;
    justify-content:center;
    padding-top:60px;
  }
  .modal-backdrop.open{ display:flex; }
  .modal{
    background:var(--ink);
    border:1px solid var(--outline);
    width:100%;
    max-width:480px;
    padding:20px;
  }
  .modal h2{
    font-family:"Arial Narrow","Helvetica Neue Condensed",Impact,sans-serif;
    margin:0 0 16px 0;
    font-size:20px;
  }
  .modal label{
    display:block;
    font-size:12px;
    color:var(--muted);
    margin-bottom:4px;
    margin-top:12px;
  }
  .modal input, .modal textarea, .modal select{
    width:100%;
    background:var(--ink);
    border:1px solid var(--muted);
    color:var(--outline);
    padding:8px 9px;
    font-size:14px;
    font-family:inherit;
  }
  .modal textarea{ min-height:80px; resize:vertical; }
  .modal-actions{
    display:flex;
    justify-content:flex-end;
    gap:10px;
    margin-top:18px;
  }
  .modal-actions button{
    font-family:inherit;
    font-size:14px;
    padding:8px 16px;
    cursor:pointer;
  }
  .btn-cancel{ background:none; border:1px solid var(--muted); color:var(--muted); }
  .btn-post{ background:var(--primary); border:1px solid var(--outline); color:var(--outline); }

  .empty{
    padding:40px 20px;
    text-align:center;
    color:var(--muted);
    font-size:14px;
  }

  /* ---- easter egg ---- */
  .egg-overlay{
    position:fixed;
    inset:0;
    z-index:999;
    display:flex;
    align-items:center;
    justify-content:center;
    background:rgba(0,0,0,0.6);
    opacity:0;
    pointer-events:none;
    transition: opacity 0.3s ease-in-out;
  }
  .egg-overlay.show{
    opacity:1;
  }
  .egg-overlay img{
    max-width:60vw;
    max-height:70vh;
    border:1px solid var(--outline);
  }

  @media (max-width:640px){
    aside{ display:none; }
    .layout{ max-width:100%; }
  }

  @media (prefers-reduced-motion: reduce){
    *{ transition:none !important; }
  }
</style>
</head>
<body>

<header>
  <span class="logo" id="siteLogo" style="cursor:pointer; user-select:none;">ryoboard</span>
  <span class="tagline">a lightweight feed</span>
  <button class="composer-btn" id="openComposer">+ new post</button>
</header>

<div class="layout">
  <main>
    <div class="sort-row" id="sortRow">
      <button data-sort="new" class="active">newest</button>
      <button data-sort="top">most liked</button>
    </div>
    <div id="feed"></div>
  </main>
  <aside>
    <h3>boards</h3>
    <ul class="board-list" id="boardList"></ul>
  </aside>
</div>

<div class="egg-overlay" id="eggOverlay">
  <img id="eggImg" src="" alt="">
</div>

<div class="modal-backdrop" id="modalBackdrop">
  <div class="modal">
    <h2 class="condensed">new post</h2>
    <label for="pBoard">board</label>
    <select id="pBoard"></select>
    <label for="pTitle">title</label>
    <input id="pTitle" placeholder="what's happening" maxlength="120">
    <label for="pText">text (optional)</label>
    <textarea id="pText" placeholder="add details..."></textarea>
    <label for="pImageUrl">image URL (optional)</label>
    <input id="pImageUrl" placeholder="https://...">
    <label for="pImageFile">or upload an image (optional)</label>
    <input id="pImageFile" type="file" accept="image/*">
    <div id="mediaPreviewWrap" style="display:none; margin-top:10px; border:1px solid var(--muted); padding:6px;">
      <img id="mediaPreview" style="display:block; max-width:100%; max-height:200px;">
    </div>
    <div class="modal-actions">
      <button class="btn-cancel" id="cancelComposer">cancel</button>
      <button class="btn-post" id="submitComposer">post</button>
    </div>
  </div>
</div>

<script>
(function(){
  const boards = ["all","builds","design","ask","showoff","random"];

  let posts = [];
  let nextId = 1;
  let activeBoard = "all";
  let activeSort = "new";
  const openComments = new Set();

  const feedEl = document.getElementById('feed');
  const boardListEl = document.getElementById('boardList');
  const sortRowEl = document.getElementById('sortRow');
  const pBoardSelect = document.getElementById('pBoard');

  function timeAgo(ts){
    const diff = Math.floor((Date.now()-ts)/1000);
    if(diff < 60) return diff+"s ago";
    if(diff < 3600) return Math.floor(diff/60)+"m ago";
    if(diff < 86400) return Math.floor(diff/3600)+"h ago";
    return Math.floor(diff/86400)+"d ago";
  }

  function renderBoardList(){
    boardListEl.innerHTML = boards.map(b =>
      `<li><button data-board="${b}" class="${b===activeBoard?'active':''}">${b}</button></li>`
    ).join('');
    pBoardSelect.innerHTML = boards.filter(b=>b!=="all").map(b=>`<option value="${b}">${b}</option>`).join('');
  }

  function sortedPosts(){
    let list = posts.filter(p => activeBoard==="all" || p.board===activeBoard);
    if(activeSort==="top"){
      list = list.slice().sort((a,b)=>b.score-a.score);
    } else {
      list = list.slice().sort((a,b)=>b.created-a.created);
    }
    return list;
  }

  function render(){
    renderBoardList();
    const list = sortedPosts();
    if(list.length===0){
      feedEl.innerHTML = `<div class="empty">nothing here yet. be the first to post in ${activeBoard}.</div>`;
      return;
    }
    feedEl.innerHTML = list.map(p => postHTML(p)).join('');
    attachPostHandlers();
  }

  function postHTML(p){
    const isOpen = openComments.has(p.id);
    return `
      <div class="post" data-id="${p.id}">
        <div class="vote-col">
          <button class="vote-btn up ${p.myVote===1?'on':''}" data-action="up" data-id="${p.id}">▲</button>
          <span class="vote-count condensed">${p.score}</span>
          <button class="vote-btn down ${p.myVote===-1?'on':''}" data-action="down" data-id="${p.id}">▼</button>
        </div>
        <div class="post-body">
          <div class="post-meta"><span class="board-tag">${p.board}</span> &middot; ${p.author} &middot; ${timeAgo(p.created)}</div>
          <h3 class="post-title" data-action="toggle" data-id="${p.id}">${escapeHTML(p.title)}</h3>
          ${p.media ? `<div class="post-media"><img src="${p.media}" alt="" loading="lazy"></div>` : ''}
          ${p.text ? `<p class="post-text">${escapeHTML(p.text)}</p>` : ''}
          <div class="post-actions">
            <button data-action="toggle" data-id="${p.id}">${p.comments.length} comments</button>
          </div>
          <div class="comments ${isOpen?'open':''}" id="comments-${p.id}">
            ${p.comments.map(c => `
              <div class="comment">
                <div class="c-meta">${c.author}</div>
                ${escapeHTML(c.text)}
              </div>
            `).join('')}
            <div class="comment-form">
              <input type="text" placeholder="write a comment..." data-comment-input="${p.id}" maxlength="280">
              <button data-action="comment" data-id="${p.id}">reply</button>
            </div>
          </div>
        </div>
      </div>
    `;
  }

  function escapeHTML(s){
    const d = document.createElement('div');
    d.innerText = s;
    return d.innerHTML;
  }

  function attachPostHandlers(){
    feedEl.querySelectorAll('[data-action="up"]').forEach(btn=>{
      btn.addEventListener('click', ()=>vote(parseInt(btn.dataset.id), 1));
    });
    feedEl.querySelectorAll('[data-action="down"]').forEach(btn=>{
      btn.addEventListener('click', ()=>vote(parseInt(btn.dataset.id), -1));
    });
    feedEl.querySelectorAll('[data-action="toggle"]').forEach(el=>{
      el.addEventListener('click', ()=>{
        const id = parseInt(el.dataset.id);
        if(openComments.has(id)) openComments.delete(id); else openComments.add(id);
        render();
      });
    });
    feedEl.querySelectorAll('[data-action="comment"]').forEach(btn=>{
      btn.addEventListener('click', ()=>{
        const id = parseInt(btn.dataset.id);
        submitComment(id);
      });
    });
    feedEl.querySelectorAll('[data-comment-input]').forEach(inp=>{
      inp.addEventListener('keydown', (e)=>{
        if(e.key==='Enter'){ submitComment(parseInt(inp.dataset.commentInput)); }
      });
    });
  }

  function submitComment(id){
    const inp = feedEl.querySelector(`[data-comment-input="${id}"]`);
    const text = inp.value.trim();
    if(!text) return;
    const post = posts.find(p=>p.id===id);
    post.comments.push({author:"you", text});
    openComments.add(id);
    render();
  }

  function vote(id, dir){
    const post = posts.find(p=>p.id===id);
    if(post.myVote === dir){
      post.score -= dir;
      post.myVote = 0;
    } else {
      post.score += dir - post.myVote;
      post.myVote = dir;
    }
    render();
  }

  boardListEl.addEventListener('click', (e)=>{
    const btn = e.target.closest('[data-board]');
    if(!btn) return;
    activeBoard = btn.dataset.board;
    render();
  });

  sortRowEl.addEventListener('click', (e)=>{
    const btn = e.target.closest('button[data-sort]');
    if(!btn) return;
    activeSort = btn.dataset.sort;
    sortRowEl.querySelectorAll('button').forEach(b=>b.classList.remove('active'));
    btn.classList.add('active');
    render();
  });

  // composer
  const backdrop = document.getElementById('modalBackdrop');
  document.getElementById('openComposer').addEventListener('click', ()=>{
    backdrop.classList.add('open');
    document.getElementById('pTitle').focus();
  });
  document.getElementById('cancelComposer').addEventListener('click', closeComposer);
  backdrop.addEventListener('click', (e)=>{ if(e.target===backdrop) closeComposer(); });
  let pendingMedia = "";
  const imageUrlInput = document.getElementById('pImageUrl');
  const imageFileInput = document.getElementById('pImageFile');
  const mediaPreviewWrap = document.getElementById('mediaPreviewWrap');
  const mediaPreview = document.getElementById('mediaPreview');

  function showPreview(src){
    pendingMedia = src;
    mediaPreview.src = src;
    mediaPreviewWrap.style.display = src ? 'block' : 'none';
  }

  imageUrlInput.addEventListener('input', ()=>{
    imageFileInput.value = '';
    showPreview(imageUrlInput.value.trim());
  });

  imageFileInput.addEventListener('change', ()=>{
    const file = imageFileInput.files[0];
    if(!file) return;
    imageUrlInput.value = '';
    const reader = new FileReader();
    reader.onload = (e)=> showPreview(e.target.result);
    reader.readAsDataURL(file);
  });

  function closeComposer(){
    backdrop.classList.remove('open');
    document.getElementById('pTitle').value = '';
    document.getElementById('pText').value = '';
    imageUrlInput.value = '';
    imageFileInput.value = '';
    showPreview('');
  }
  document.getElementById('submitComposer').addEventListener('click', ()=>{
    const title = document.getElementById('pTitle').value.trim();
    const text = document.getElementById('pText').value.trim();
    const board = pBoardSelect.value;
    const media = pendingMedia;
    if(!title) { document.getElementById('pTitle').focus(); return; }
    posts.unshift({id:nextId++, board, author:"you", title, text, media, score:1, myVote:1, created:Date.now(), comments:[]});
    closeComposer();
    activeSort = "new";
    sortRowEl.querySelectorAll('button').forEach(b=>b.classList.toggle('active', b.dataset.sort==='new'));
    render();
  });

  let logoClicks = 0;
  let logoClickTimer = null;
  const eggOverlay = document.getElementById("eggOverlay");
  const eggImg = document.getElementById("eggImg");
  document.getElementById("siteLogo").addEventListener("click", ()=>{
    logoClicks++;

    logoClickTimer = setTimeout(()=>{ logoClicks = 0; }, 1500);

      clearTimeout(logoClickTimer);

  }
